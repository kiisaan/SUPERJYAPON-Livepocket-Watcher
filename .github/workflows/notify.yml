name: LivePocket SUPERJYAPON Notifier

on:
  schedule:
    - cron: '17 * * * *'  # 保険（0分は混むので避ける）。本命は cron-job.org からの起動
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'キャッシュをクリアして再取得しますか？'
        type: boolean
        default: false

# 同時に動かさない（通知済みキャッシュを2つが同時に読んで二重通知になるのを防ぐ）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: Playwrightブラウザのキャッシュ
        id: pw-cache
        uses: actions/cache@v4
        with:
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          path: ~/.cache/ms-playwright

      - name: Playwrightのインストール
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install chromium
            playwright install-deps chromium
          else
            playwright install chromium --with-deps
          fi

      - name: 通知済み・開催済みキャッシュの復元
        if: ${{ inputs.clear_cache != true }}
        uses: actions/cache@v4
        with:
          key: notified-urls-cache-${{ github.run_id }}
          restore-keys: notified-urls-cache-
          path: |
            notified_urls.txt
            past_events.json

      - name: スクリプトの実行
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
