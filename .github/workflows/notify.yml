name: LivePocket SUPERJYAPON Notifier

on:
  schedule:
    - cron: '17 * * * *'  # 保険（0分は混むので避ける）。本命は cron-job.org からの起動
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'キャッシュをクリアして再取得しますか？'
        type: boolean
        default: false

# 同時に動かさない（通知済みキャッシュを2つが同時に読んで二重通知になるのを防ぐ）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'            # pipのダウンロードをキャッシュ

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: Playwrightブラウザのキャッシュ
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Playwrightのインストール
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # ブラウザ本体はキャッシュ済み。OS依存ライブラリだけ入れる
            playwright install chromium
            playwright install-deps chromium
          else
            playwright install chromium --with-deps
          fi

      - name: 通知済み・開催済みキャッシュの復元
        if: ${{ inputs.clear_cache != true }}
        uses: actions/cache@v4
        with:
          path: |
            notified_urls.txt
            past_events.json
