name: LivePocket SUPERJYAPON Notifier

on:
  schedule:
    - cron: '17 * * * *'  # 保険（0分は混むので避ける）。本命は cron-job.org からの起動
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'キャッシュをクリアして再取得しますか？'
        type: boolean
        default: false

# 同時に動かさない（通知済みキャッシュを2つが同時に読んで二重通知になるのを防ぐ）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: Playwrightブラウザのキャッシュ
        id: pw-cache
        uses: actions/cache@v4
        with:
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          path: ~/.cache/ms-playwright

      - name: Playwrightのインストール
